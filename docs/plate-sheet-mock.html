<!doctype html>
<!-- Reference mock for the plate sheet's barbell figure (docs/pro-starting-weights-spec.md, section 3).
     Built 2 Nov 2026. The SVG is the drawing to port to react-native-svg in components/barbell-figure.tsx:
     same viewBox, same coordinates, same radii. Plate x positions: the first plate sits against the collar
     (x=100 left / x=224 right) and each next plate steps outward by its width plus a 2pt gap.
     Colours are PLATE_TONES; the hex values here are the light-theme fills. -->
<html><head><meta charset="utf-8">
<style>
  body { margin:0; background:#F7F6F3; font-family: 'Outfit', -apple-system, Helvetica, sans-serif; color:#1A1A1A; }
  .sheet { width: 390px; background:#fff; border-radius: 28px 28px 0 0; padding: 20px 24px 28px; margin: 24px auto; box-shadow: 0 -2px 20px rgba(0,0,0,.08); }
  .handle { width: 40px; height: 5px; border-radius: 3px; background:#C9C5BD; margin: 0 auto 18px; }
  h1 { font-size: 26px; font-weight: 700; text-align:center; margin: 0 0 4px; letter-spacing: -0.3px; }
  .sub { text-align:center; color:#6B6761; font-size: 15px; margin: 0 0 18px; }
  .perside { text-align:center; color:#6B6761; font-size: 13px; letter-spacing:.08em; text-transform: uppercase; margin: 14px 0 10px; font-weight: 600; }
  .row { display:flex; justify-content:center; align-items:center; gap: 18px; margin: 0; }
  .item { display:flex; align-items:center; gap: 5px; }
  .dot { width: 38px; height: 38px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-weight: 700; font-size: 15px; color:#fff; font-variant-numeric: tabular-nums; }
  .dot.sm { width: 32px; height: 32px; font-size: 13px; }
  .mult { font-size: 15px; color:#6B6761; font-weight: 600; font-variant-numeric: tabular-nums; }
  .btn { margin-top: 18px; background:#1B5FA8; color:#fff; border-radius: 16px; padding: 16px; text-align:center; font-weight:600; font-size: 17px; }
  .label { font-size: 12px; color:#9A958C; text-align:center; margin: 32px 0 0; text-transform: uppercase; letter-spacing: .08em; }
  .closest { text-align:center; color:#6B6761; font-size: 15px; margin: 12px 0 0; }
  .closest b { color:#1B5FA8; font-weight: 600; }
  svg { display:block; margin: 0 auto; }
</style></head>
<body>

<div class="label">365 lbs, grouped with multipliers</div>
<div class="sheet">
  <div class="handle"></div>
  <h1>365 lbs</h1>
  <p class="sub">45 lbs bar</p>
  <svg width="342" height="120" viewBox="0 0 342 120">
    <rect x="0" y="56" width="342" height="8" rx="4" fill="#8E8A83"/>
    <rect x="0" y="52" width="128" height="16" rx="3" fill="#A6A29A"/>
    <rect x="214" y="52" width="128" height="16" rx="3" fill="#A6A29A"/>
    <rect x="122" y="44" width="10" height="32" rx="3" fill="#6F6B64"/>
    <rect x="210" y="44" width="10" height="32" rx="3" fill="#6F6B64"/>
    <rect x="100" y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
    <rect x="80"  y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
    <rect x="62"  y="22" width="16" height="76" rx="4" fill="#D9B44A"/>
    <rect x="44"  y="22" width="16" height="76" rx="4" fill="#D9B44A"/>
    <rect x="34"  y="42" width="8"  height="36" rx="3" fill="#C8463C"/>
    <rect x="224" y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
    <rect x="244" y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
    <rect x="264" y="22" width="16" height="76" rx="4" fill="#D9B44A"/>
    <rect x="282" y="22" width="16" height="76" rx="4" fill="#D9B44A"/>
    <rect x="300" y="42" width="8"  height="36" rx="3" fill="#C8463C"/>
  </svg>
  <p class="perside">Per side</p>
  <div class="row">
    <span class="item"><span class="dot" style="background:#1B5FA8">45</span><span class="mult">×2</span></span>
    <span class="item"><span class="dot" style="background:#D9B44A">35</span><span class="mult">×2</span></span>
    <span class="item"><span class="dot sm" style="background:#C8463C">5</span><span class="mult">×1</span></span>
  </div>
  <div class="btn">Done</div>
</div>

<div class="label">495 lbs, one group</div>
<div class="sheet">
  <div class="handle"></div>
  <h1>495 lbs</h1>
  <p class="sub">45 lbs bar</p>
  <svg width="342" height="120" viewBox="0 0 342 120">
    <rect x="0" y="56" width="342" height="8" rx="4" fill="#8E8A83"/>
    <rect x="0" y="52" width="128" height="16" rx="3" fill="#A6A29A"/>
    <rect x="214" y="52" width="128" height="16" rx="3" fill="#A6A29A"/>
    <rect x="122" y="44" width="10" height="32" rx="3" fill="#6F6B64"/>
    <rect x="210" y="44" width="10" height="32" rx="3" fill="#6F6B64"/>
    <rect x="100" y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
    <rect x="80"  y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
    <rect x="60"  y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
    <rect x="40"  y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
    <rect x="20"  y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
    <rect x="224" y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
    <rect x="244" y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
    <rect x="264" y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
    <rect x="284" y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
    <rect x="304" y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
  </svg>
  <p class="perside">Per side</p>
  <div class="row">
    <span class="item"><span class="dot" style="background:#1B5FA8">45</span><span class="mult">×5</span></span>
  </div>
  <div class="btn">Done</div>
</div>

<div class="label">137.5 lbs, short</div>
<div class="sheet">
  <div class="handle"></div>
  <h1>137.5 lbs</h1>
  <p class="sub">45 lbs bar</p>
  <svg width="342" height="120" viewBox="0 0 342 120">
    <rect x="0" y="56" width="342" height="8" rx="4" fill="#8E8A83"/>
    <rect x="0" y="52" width="128" height="16" rx="3" fill="#A6A29A"/>
    <rect x="214" y="52" width="128" height="16" rx="3" fill="#A6A29A"/>
    <rect x="122" y="44" width="10" height="32" rx="3" fill="#6F6B64"/>
    <rect x="210" y="44" width="10" height="32" rx="3" fill="#6F6B64"/>
    <rect x="100" y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
    <rect x="224" y="12" width="18" height="96" rx="4" fill="#1B5FA8"/>
  </svg>
  <p class="perside">Per side</p>
  <div class="row">
    <span class="item"><span class="dot" style="background:#1B5FA8">45</span><span class="mult">×1</span></span>
  </div>
  <p class="closest">Your plates can't make 137.5. Closest is <b>135</b></p>
  <div class="btn">Done</div>
</div>

</body></html>
