<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FDFCFB" />
<title>Offline | LiftCamp</title>
<style>
  :root { color-scheme: light dark; }
  html,body { margin:0; height:100%; }
  body {
    display:flex; align-items:center; justify-content:center;
    background:#FDFCFB; color:#221F1B;
    font-family: "Outfit", ui-sans-serif, system-ui, -apple-system, sans-serif;
    padding: 2rem; text-align:center;
  }
  @media (prefers-color-scheme: dark) { body { background:#16151A; color:#EDEBE8; } }
  .wrap { max-width: 22rem; }
  img { width:72px; height:72px; margin:0 auto 1.25rem; display:block; }
  h1 { font-size:1.25rem; font-weight:700; letter-spacing:-0.01em; margin:0 0 .5rem; }
  p { font-size:.875rem; line-height:1.5; opacity:.7; margin:0 0 1.5rem; }
  button {
    font: inherit; font-weight:600; font-size:.875rem;
    background:#1B5FA8; color:#fff; border:0; border-radius:.625rem;
    padding:.625rem 1.25rem; cursor:pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/icons/icon-192.png" alt="" />
    <h1>No connection</h1>
    <p>LiftCamp needs a connection to load this page. Your logged sets are safe. Reconnect and carry on.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
